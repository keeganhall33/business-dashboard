name: "[Agent Orchestration] Task"
description: "Architect↔Jeeves orchestration task using OrchestrationTaskV1"
title: "[Agent Orchestration] <short task title>"
labels:
  - agent-orchestration
  - orch:ready
body:
  - type: markdown
    attributes:
      value: |
        This template is the canonical architect→Jeeves task surface.

        - Use durable references (e.g. `docs/intelligence/ROADMAP.md`) and specify a small delta.
        - Keep it bounded. No credentials. No outreach.
        - New tasks use the Business Value V2 contract so technical output stays tied to a measurable business result.
        - Retries must be evidence-driven. Repeated failure without measurable progress must reroute, escalate, or stop.

  - type: input
    id: contract_version
    attributes:
      label: contract_version
      value: BUSINESS_VALUE_V2
    validations:
      required: true

  - type: input
    id: task_id
    attributes:
      label: task_id
      description: Unique task id (stable across edits)
      placeholder: orch-YYYYMMDD-001
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: milestone
      placeholder: AGENT_ORCHESTRATION_V1_TASK_SURFACE
    validations:
      required: true

  - type: dropdown
    id: stream
    attributes:
      label: stream
      options:
        - CORE_INTELLIGENCE
        - DISCOVERY_INTELLIGENCE
        - INTELLIGENCE_UX
        - PRODUCTION_VALUE
        - QA_EVALUATION
        - INTEGRATION_RELEASE
        - AGENT_ORCHESTRATION
        - OTHER
    validations:
      required: true

  - type: dropdown
    id: verification_owner
    attributes:
      label: verification_owner
      description: The implementer may not certify its own work.
      options:
        - INDEPENDENT
    validations:
      required: true

  - type: textarea
    id: business_outcome
    attributes:
      label: Business outcome
      description: The observable business state this task must improve or enable.
      placeholder: Keegan can identify the highest-value next action without reviewing multiple reports.
    validations:
      required: true

  - type: textarea
    id: business_reason
    attributes:
      label: Business reason
      description: Why this work matters now, including the decision, revenue, time, risk, or relationship it supports.
    validations:
      required: true

  - type: textarea
    id: success_metric
    attributes:
      label: Success metric
      description: A measurable threshold or binary outcome. Avoid vague terms such as improved or optimized.
    validations:
      required: true

  - type: textarea
    id: proof_required
    attributes:
      label: Proof required
      description: Current-run evidence an independent verifier must inspect before approval.
      placeholder: Exact test output, current screenshots, stored record, or source-linked decision evidence.
    validations:
      required: true

  - type: dropdown
    id: requested_by
    attributes:
      label: requested_by
      options:
        - KEEGAN
        - ARCHITECT
        - JEEVES
        - SYSTEM
    validations:
      required: true

  - type: input
    id: assigned_agent
    attributes:
      label: assigned_agent
      placeholder: JEEVES
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: dropdown
    id: delivery_mode
    attributes:
      label: delivery_mode
      description: Prefer VERTICAL_SLICE. Use PLATFORM_PRIMITIVE only when it directly unlocks an active slice.
      options:
        - VERTICAL_SLICE
        - DEFECT
        - PLATFORM_PRIMITIVE
    validations:
      required: true

  - type: input
    id: slice_id
    attributes:
      label: slice_id
      description: Stable workflow identifier shared by all tasks required to make one outcome operational.
      placeholder: relationship-followup-v1
    validations:
      required: true

  - type: dropdown
    id: slice_stage
    attributes:
      label: slice_stage
      options:
        - DISCOVERY
        - CONTRACT
        - IMPLEMENTATION
        - INTEGRATION
        - PRODUCTION_VERIFICATION
    validations:
      required: true

  - type: input
    id: depends_on
    attributes:
      label: depends_on
      description: Comma-separated task_ids that must be COMPLETE, or NONE.
      placeholder: NONE
    validations:
      required: true

  - type: input
    id: quality_gates
    attributes:
      label: quality_gates
      description: Fixed fail-closed gates. Integration slices must also include BUILD.
      placeholder: DIFF_CHECK,TYPECHECK,TEST
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: outcome
      description: The real user or business result that becomes possible.
    validations:
      required: true

  - type: textarea
    id: user_flow
    attributes:
      label: user_flow
      description: The complete input → decision → action → outcome path this task advances.
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: definition_of_done
      description: Real data, persistence, visible output, agent use, controls, outcome capture, and verification required for operational completion.
    validations:
      required: true

  - type: textarea
    id: production_evidence
    attributes:
      label: production_evidence
      description: Required evidence for PRODUCTION_VERIFICATION; use NOT_THIS_STAGE earlier.
      placeholder: NOT_THIS_STAGE
    validations:
      required: true

  - type: dropdown
    id: human_approval_required
    attributes:
      label: human_approval_required
      options:
        - "false"
        - "true"
    validations:
      required: true

  - type: input
    id: max_attempts
    attributes:
      label: max_attempts
      description: Hard retry ceiling. Reaching the ceiling requires reroute, escalation, or stop.
      value: "3"
    validations:
      required: true

  - type: dropdown
    id: task_mutability
    attributes:
      label: task_mutability
      options:
        - IMPLEMENTATION_MUTATION_REQUIRED
        - VALIDATION_EVIDENCE_ONLY
        - EVIDENCE_ONLY
    validations:
      required: true

  - type: input
    id: max_tool_calls
    attributes:
      label: max_tool_calls
      description: Maximum tool calls allowed for this task unless explicitly revised.
      value: "20"
    validations:
      required: true

  - type: textarea
    id: progress_signal
    attributes:
      label: Measurable progress signal
      description: What new evidence or state change proves that another attempt is productive.
      placeholder: A failing test count decreases, a missing primary source is found, or a previously blocked verifier gate passes.
    validations:
      required: true

  - type: textarea
    id: retry_reroute_policy
    attributes:
      label: Retry / reroute policy
      description: What to do if the same failure repeats without measurable progress.
      placeholder: Retry only with new evidence; otherwise use alternate route X, then escalate if still blocked.
    validations:
      required: true

  - type: input
    id: file_ownership
    attributes:
      label: file_ownership
      description: Comma-separated exact files or narrow directories this task may mutate.
      placeholder: src/lib/example,test/example
    validations:
      required: true

  - type: input
    id: target_pr
    attributes:
      label: Target PR
      description: Required for INTEGRATION_RELEASE; use NONE for other streams.
      placeholder: NONE
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: Durable references (paths, PRs) that define the baseline.
      placeholder: |
        - docs/intelligence/ROADMAP.md
        - PR #192
    validations:
      required: true

  - type: textarea
    id: delta
    attributes:
      label: Delta
      description: What this task changes vs the reference baseline.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Explicit files/modules/surfaces in-scope.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Hard constraints (allowed/forbidden actions, boundaries).
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true

  - type: textarea
    id: forbidden
    attributes:
      label: Forbidden
      description: Explicitly forbidden actions.
    validations:
      required: true
