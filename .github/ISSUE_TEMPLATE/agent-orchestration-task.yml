name: "[Agent Orchestration] Task"
description: "Architect↔Jeeves orchestration task using OrchestrationTaskV1"
title: "[Agent Orchestration] <short task title>"
labels:
  - agent-orchestration
  - orch:ready
body:
  - type: markdown
    attributes:
      value: |
        This template is the canonical architect→Jeeves task surface.

        - Use durable references (e.g. `docs/intelligence/ROADMAP.md`) and specify a small delta.
        - Keep it bounded. No credentials. No outreach.
        - New tasks use the Business Value V2 contract so technical output stays tied to a measurable business result.

  - type: input
    id: contract_version
    attributes:
      label: contract_version
      value: BUSINESS_VALUE_V2
    validations:
      required: true

  - type: input
    id: task_id
    attributes:
      label: task_id
      description: Unique task id (stable across edits)
      placeholder: orch-YYYYMMDD-001
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: milestone
      placeholder: AGENT_ORCHESTRATION_V1_TASK_SURFACE
    validations:
      required: true

  - type: dropdown
    id: stream
    attributes:
      label: stream
      options:
        - CORE_INTELLIGENCE
        - DISCOVERY_INTELLIGENCE
        - INTELLIGENCE_UX
        - AGENT_ORCHESTRATION
        - OTHER
    validations:
      required: true

  - type: dropdown
    id: verification_owner
    attributes:
      label: verification_owner
      description: The implementer may not certify its own work.
      options:
        - INDEPENDENT
    validations:
      required: true

  - type: textarea
    id: business_outcome
    attributes:
      label: Business outcome
      description: The observable business state this task must improve or enable.
      placeholder: Keegan can identify the highest-value next action without reviewing multiple reports.
    validations:
      required: true

  - type: textarea
    id: business_reason
    attributes:
      label: Business reason
      description: Why this work matters now, including the decision, revenue, time, risk, or relationship it supports.
    validations:
      required: true

  - type: textarea
    id: success_metric
    attributes:
      label: Success metric
      description: A measurable threshold or binary outcome. Avoid vague terms such as improved or optimized.
    validations:
      required: true

  - type: textarea
    id: proof_required
    attributes:
      label: Proof required
      description: Current-run evidence an independent verifier must inspect before approval.
      placeholder: Exact test output, current screenshots, stored record, or source-linked decision evidence.
    validations:
      required: true

  - type: dropdown
    id: requested_by
    attributes:
      label: requested_by
      options:
        - KEEGAN
        - ARCHITECT
        - JEEVES
        - SYSTEM
    validations:
      required: true

  - type: input
    id: assigned_agent
    attributes:
      label: assigned_agent
      placeholder: JEEVES
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: dropdown
    id: human_approval_required
    attributes:
      label: human_approval_required
      options:
        - "false"
        - "true"
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: Durable references (paths, PRs) that define the baseline.
      placeholder: |
        - docs/intelligence/ROADMAP.md
        - PR #192
    validations:
      required: true

  - type: textarea
    id: delta
    attributes:
      label: Delta
      description: What this task changes vs the reference baseline.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Explicit files/modules/surfaces in-scope.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Hard constraints (allowed/forbidden actions, boundaries).
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true

  - type: textarea
    id: forbidden
    attributes:
      label: Forbidden
      description: Explicitly forbidden actions.
    validations:
      required: true
