name: Orchestration V3 CI (manual rollback only)

on:
  workflow_dispatch:

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard manual legacy execution
        run: |
          echo "V3 is retained only as rollback evidence/fallback. V4 is the sole active orchestration runtime."
      - name: Syntax check V3 scripts
        run: |
          node --check scripts/orchestration-v3/config.mjs
          node --check scripts/orchestration-v3/preflight.mjs
          node --check scripts/orchestration-v3/watcher.mjs
          node --check scripts/orchestration-v3/worker.mjs
          node --check scripts/orchestration-v3/doctor.mjs
          node --check scripts/orchestration-v3/prepare-host.mjs
          node --check scripts/orchestration-v3/activate-host.mjs
          node --check scripts/orchestration-v3/bootstrap-host.mjs
          node --check scripts/orchestration-v3/diagnose-local-tool.mjs
          node --check scripts/orchestration-v3/diagnose-local-tool-observed.mjs
          node --check scripts/orchestration-run-issue-openclaw.mjs
      - name: Control-plane invariants
        run: node --test test/orchestration-v3-control-plane.test.mjs test/orchestration-v3-agent-exec-entrypoint.test.mjs test/orchestration-v3-local-tool-diagnostic.test.mjs test/orchestration-v3-local-tool-observed.test.mjs test/orchestration-v3-code-mode-bridge.test.mjs test/orchestration-v3-stale-lease-reconcile.test.mjs test/orchestration-v3-stale-running-reconciliation.test.mjs test/orchestration-v3-github-transient-safety.test.mjs
