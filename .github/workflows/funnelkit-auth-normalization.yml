name: FunnelKit Auth Normalization

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/funnelkit-auth-trigger"

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: 1Password/install-cli-action@v1
      - name: Test safe credential normalizations
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          op item get "FunnelKit API Credentials" --vault OpenClaw --format=json > /tmp/fk.json
          node <<'NODE'
          const fs=require('fs');
          const item=JSON.parse(fs.readFileSync('/tmp/fk.json','utf8'));
          const fields=(item.fields||[]).map(f=>({label:String(f.label||'').toLowerCase(),id:String(f.id||'').toLowerCase(),value:typeof f.value==='string'?f.value.trim():''})).filter(x=>x.value);
          const by=(names,ids=[])=>fields.find(x=>names.includes(x.label)||ids.includes(x.id));
          const urlE=by(['url','website','base url','site url'],['url']);
          const userE=by(['username','user','login'],['username']);
          const noteE=fields.find(x=>x!==urlE&&x!==userE);
          if(!urlE||!userE||!noteE) throw new Error('credential_shape_unrecognized');
          let base=urlE.value;if(!/^https?:\/\//i.test(base))base='https://'+base;base=base.replace(/\/$/,'');const wi=base.indexOf('/wp-json/');const site=wi>=0?base.slice(0,wi):base;
          const raw=noteE.value;
          const labels=[...raw.matchAll(/(?:^|\n)\s*([A-Za-z][A-Za-z0-9 _-]{0,30})\s*:/g)].map(m=>m[1].trim().toLowerCase());
          console.log(`NOTE_META length=${raw.length} lines=${raw.split(/\r?\n/).length} spaces=${(raw.match(/\s/g)||[]).length} colons=${(raw.match(/:/g)||[]).length} detected_labels=${labels.join(',')||'none'}`);
          const variants=new Map();
          const add=(name,v)=>{if(v&&typeof v==='string'&&v.trim())variants.set(name,v.trim())};
          add('raw',raw);
          add('no_spaces',raw.replace(/\s+/g,''));
          const patterns=[/application\s*password\s*:\s*([^\r\n]+)/i,/app\s*password\s*:\s*([^\r\n]+)/i,/password\s*:\s*([^\r\n]+)/i,/credential\s*:\s*([^\r\n]+)/i,/secret\s*:\s*([^\r\n]+)/i];
          for(const p of patterns){const m=raw.match(p);if(m){add('parsed_line',m[1]);add('parsed_line_no_spaces',m[1].replace(/\s+/g,''));break}}
          const describe=async r=>{try{const d=await r.json();return {code:String(d?.code||''),msg:String(d?.message||'').replace(/\s+/g,' ').slice(0,100)}}catch{return {code:'',msg:''}}};
          (async()=>{
            for(const [name,password] of variants){
              const headers={Authorization:'Basic '+Buffer.from(userE.value+':'+password).toString('base64'),Accept:'application/json','User-Agent':'business-dashboard-funnelkit-auth-probe/1.0'};
              const me=await fetch(site+'/wp-json/wp/v2/users/me?context=edit',{headers,redirect:'manual'});const md=await describe(me.clone());
              const fk=await fetch(site+'/wp-json/funnelkit-app/funnel-analytics/1/steps?after=2026-08-27&before=2026-08-28',{headers,redirect:'manual'});const fd=await describe(fk.clone());
              console.log(`AUTH_VARIANT name=${name} wp_me=${me.status}:${md.code} funnelkit=${fk.status}:${fd.code}`);
            }
          })().catch(e=>{console.error('AUTH_FATAL='+String(e.name||'Error'));process.exit(1)});
          NODE
          rm -f /tmp/fk.json
