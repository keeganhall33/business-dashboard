name: FunnelKit Auth Normalization

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/funnelkit-auth-trigger"

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: 1Password/install-cli-action@v1
      - name: Test FunnelKit WordPress application credential
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          op item get "FunnelKit API Credentials" --vault OpenClaw --format=json > /tmp/fk.json
          node <<'NODE'
          const fs = require('fs');
          const item = JSON.parse(fs.readFileSync('/tmp/fk.json','utf8'));
          const fields = (item.fields || []).map(f => ({
            label: String(f.label || '').trim().toLowerCase(),
            id: String(f.id || '').trim().toLowerCase(),
            value: typeof f.value === 'string' ? f.value.trim() : ''
          })).filter(f => f.value);
          const by = (labels, ids=[]) => fields.find(f => labels.includes(f.label) || ids.includes(f.id));
          const urlE = by(['url','website','base url','site url'], ['url']);
          const userE = by(['username','user','login'], ['username']);
          const passE = by(['password','application password','app password','api password'], ['password','credential']);
          if (!urlE || !userE || !passE) {
            console.log(`CREDENTIAL_FIELDS url=${Boolean(urlE)} username=${Boolean(userE)} password=${Boolean(passE)} labels=${fields.map(f=>f.label||f.id).join(',')}`);
            process.exit(2);
          }
          let base = urlE.value;
          if (!/^https?:\/\//i.test(base)) base = 'https://' + base;
          base = base.replace(/\/$/, '');
          const wpIdx = base.indexOf('/wp-json/');
          const site = wpIdx >= 0 ? base.slice(0, wpIdx) : base;
          const variants = new Map([
            ['as_stored', passE.value],
            ['without_spaces', passE.value.replace(/\s+/g,'')]
          ]);
          const describe = async r => {
            try {
              const d = await r.clone().json();
              return { code: String(d?.code || ''), message: String(d?.message || '').replace(/\s+/g,' ').slice(0,120), shape: Array.isArray(d) ? `array:${d.length}` : (d && typeof d === 'object' ? `object:${Object.keys(d).slice(0,12).sort().join(',')}` : typeof d) };
            } catch { return { code:'', message:'', shape:'non_json' }; }
          };
          (async () => {
            console.log(`CREDENTIAL_FIELD_SELECTED=${passE.label || passE.id}`);
            for (const [name,password] of variants) {
              const headers = { Authorization: 'Basic ' + Buffer.from(`${userE.value}:${password}`).toString('base64'), Accept:'application/json', 'User-Agent':'business-dashboard-funnelkit-auth-probe/2.0' };
              const me = await fetch(site + '/wp-json/wp/v2/users/me?context=edit', { headers, redirect:'manual' });
              const md = await describe(me);
              console.log(`WP_AUTH variant=${name} status=${me.status} code=${md.code} shape=${md.shape}`);
              if (me.ok) {
                const root = await fetch(site + '/wp-json/funnelkit-app/', { headers, redirect:'manual' });
                const rd = await describe(root);
                console.log(`FUNNELKIT_ROOT variant=${name} status=${root.status} code=${rd.code} shape=${rd.shape}`);
                process.exit(0);
              }
            }
            process.exit(3);
          })().catch(e => { console.error('AUTH_FATAL=' + String(e?.name || 'Error')); process.exit(1); });
          NODE
          rm -f /tmp/fk.json
