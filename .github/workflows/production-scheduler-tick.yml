name: Production Scheduler Tick

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *" # wake the scheduler every five minutes

concurrency:
  group: scheduler-tick-production
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Guard: required secrets
        env:
          SCHEDULER_TICK_URL: ${{ secrets.SCHEDULER_TICK_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SCHEDULER_TICK_URL}" ]; then
            echo "Missing SCHEDULER_TICK_URL" >&2
            exit 1
          fi
          if [ -z "${SCHEDULER_SECRET}" ]; then
            echo "Missing SCHEDULER_SECRET" >&2
            exit 1
          fi

      - name: POST /api/scheduler/tick (authenticated)
        env:
          SCHEDULER_TICK_URL: ${{ secrets.SCHEDULER_TICK_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          set -euo pipefail

          # Never echo the URL or secret.
          STATUS=$(curl -sS -o /tmp/tick.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${SCHEDULER_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 20 \
            "${SCHEDULER_TICK_URL}")

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Tick failed with HTTP $STATUS" >&2
            # Print only safe body (must not contain secrets by contract)
            cat /tmp/tick.json >&2 || true
            exit 1
          fi

          echo "Tick succeeded (HTTP $STATUS)"
