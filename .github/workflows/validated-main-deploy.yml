name: Validated Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validated-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate integrated main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          PG_BIN="$(pg_config --bindir)"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          "$PG_BIN/initdb" --version

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Focused/unit test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check

  production-smoke:
    name: Smoke check Vercel production
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ vars.DASHBOARD_PRODUCTION_URL != '' }}
    env:
      SMOKE_BASE_URL: ${{ vars.DASHBOARD_PRODUCTION_URL }}
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v4
      - name: Smoke check configured production URL
        shell: bash
        run: ./scripts/smoke-check.sh

# Deployment policy:
# - Vercel Git integration is the only production deployment path.
# - This workflow validates main and optionally smoke-checks the configured Vercel production URL.
# - Fly deployment credentials, flyctl, and Vercel deploy hooks are intentionally not used here.
