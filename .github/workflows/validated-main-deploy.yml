name: Validated Main

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validated-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate integrated code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          PG_BIN="$(pg_config --bindir)"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          "$PG_BIN/initdb" --version

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Focused/unit test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check

  production-smoke:
    name: Smoke check Vercel production
    needs: validate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && vars.DASHBOARD_PRODUCTION_URL != '' }}
    env:
      SMOKE_BASE_URL: ${{ vars.DASHBOARD_PRODUCTION_URL }}
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v4
      - name: Smoke check configured production URL
        shell: bash
        run: ./scripts/smoke-check.sh

# Deployment policy:
# - Vercel Git integration is the only production deployment path.
# - Pull requests and main both receive the same GitHub-native typecheck/test/build validation.
# - Production smoke checks run only after a validated push to main.
# - Retired provider deployment tooling and deploy hooks are intentionally absent.
