name: FunnelKit Route Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/funnelkit-route-trigger"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: 1Password/install-cli-action@v1
      - name: Discover installed FunnelKit REST analytics routes
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          op item get "FunnelKit API Credentials" --vault OpenClaw --format=json > /tmp/fk.json
          node <<'NODE'
          const fs=require('fs');
          const item=JSON.parse(fs.readFileSync('/tmp/fk.json','utf8'));
          const vals=(item.fields||[]).map(f=>({label:String(f.label||'').toLowerCase(),id:String(f.id||'').toLowerCase(),value:typeof f.value==='string'?f.value.trim():''})).filter(x=>x.value);
          const get=(names,ids=[])=>vals.find(x=>names.includes(x.label)||ids.includes(x.id));
          const urlE=get(['url','website','base url','site url'],['url']);
          const userE=get(['username','user','login'],['username']);
          let passE=get(['password','credential','app password','application password','secret','api key','key','token'],['password','credential']);
          if(!passE&&vals.length===3&&urlE&&userE) passE=vals.find(x=>x!==urlE&&x!==userE);
          if(!urlE||!userE||!passE) throw new Error('credential_shape_unrecognized');
          let base=urlE.value; if(!/^https?:\/\//i.test(base)) base='https://'+base; base=base.replace(/\/$/,'');
          const wi=base.indexOf('/wp-json/'); const site=wi>=0?base.slice(0,wi):base;
          const headers={Authorization:'Basic '+Buffer.from(userE.value+':'+passE.value).toString('base64'),Accept:'application/json','User-Agent':'business-dashboard-funnelkit-route-discovery/1.1'};
          const describe=async(res)=>{let code='',msg='',shape='';try{const d=await res.clone().json();code=String(d?.code||'').slice(0,80);msg=String(d?.message||'').replace(/\s+/g,' ').slice(0,120);shape=Array.isArray(d)?`array:${d.length}`:(d&&typeof d==='object'?`object:${Object.keys(d).slice(0,12).sort().join(',')}`:typeof d)}catch{shape='non_json'}return {code,msg,shape}};
          (async()=>{
            const res=await fetch(site+'/wp-json/funnelkit-app/',{headers});
            const root=await res.json();
            const routes=root&&root.routes&&typeof root.routes==='object'?root.routes:{};
            const analytics=Object.entries(routes).filter(([path])=>/analytic|stat|report|conversion|revenue/i.test(path));
            console.log(`ANALYTICS_ROUTE_COUNT=${analytics.length}`);
            for(const [path,def] of analytics){
              const endpoints=Array.isArray(def.endpoints)?def.endpoints:[];
              const summary=endpoints.map(ep=>{const methods=Array.isArray(ep.methods)?ep.methods.join(','):String(ep.methods||'');const args=ep.args&&typeof ep.args==='object'?Object.keys(ep.args).sort().join(','):'';return `{methods=${methods};args=${args}}`}).join('|');
              console.log(`ANALYTICS_ROUTE path=${path} ${summary}`);
            }
            const tests=[
              ['/funnelkit-app/funnels/1','GET'],
              ['/funnelkit-app/canvas/1/nodes','GET'],
              ['/funnelkit-app/funnels','GET']
            ];
            for(const [path,method] of tests){const r=await fetch(site+'/wp-json'+path,{headers,method,redirect:'manual'});const d=await describe(r);console.log(`AUTH_TEST path=${path} status=${r.status} code=${JSON.stringify(d.code)} msg=${JSON.stringify(d.msg)} shape=${d.shape}`)}
          })().catch(e=>{console.error('DISCOVERY_FATAL='+String(e.name||'Error'));process.exit(1)});
          NODE
          rm -f /tmp/fk.json
