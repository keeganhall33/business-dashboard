name: FunnelKit Route Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/funnelkit-route-trigger"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: 1Password/install-cli-action@v1
      - name: Discover installed FunnelKit REST analytics routes
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          op item get "FunnelKit API Credentials" --vault OpenClaw --format=json > /tmp/fk.json
          node <<'NODE'
          const fs=require('fs');
          const item=JSON.parse(fs.readFileSync('/tmp/fk.json','utf8'));
          const vals=(item.fields||[]).map(f=>({label:String(f.label||'').toLowerCase(),id:String(f.id||'').toLowerCase(),value:typeof f.value==='string'?f.value.trim():''})).filter(x=>x.value);
          const get=(names,ids=[])=>vals.find(x=>names.includes(x.label)||ids.includes(x.id));
          const urlE=get(['url','website','base url','site url'],['url']);
          const userE=get(['username','user','login'],['username']);
          let passE=get(['password','credential','app password','application password','secret','api key','key','token'],['password','credential']);
          if(!passE&&vals.length===3&&urlE&&userE) passE=vals.find(x=>x!==urlE&&x!==userE);
          if(!urlE||!userE||!passE) throw new Error('credential_shape_unrecognized');
          let base=urlE.value; if(!/^https?:\/\//i.test(base)) base='https://'+base; base=base.replace(/\/$/,'');
          const wi=base.indexOf('/wp-json/'); const site=wi>=0?base.slice(0,wi):base;
          const headers={Authorization:'Basic '+Buffer.from(userE.value+':'+passE.value).toString('base64'),Accept:'application/json','User-Agent':'business-dashboard-funnelkit-route-discovery/1.0'};
          const safeError=async(res)=>{try{const d=await res.clone().json();return `${String(d.code||'').slice(0,60)}:${String(d.message||'').replace(/\s+/g,' ').slice(0,120)}`}catch{return ''}};
          (async()=>{
            const res=await fetch(site+'/wp-json/funnelkit-app/',{headers});
            console.log(`ROOT_STATUS=${res.status}`);
            const root=await res.json();
            const routes=root&&root.routes&&typeof root.routes==='object'?root.routes:{};
            const matches=Object.entries(routes).filter(([path])=>/funnel|analytics|step|order|conversion/i.test(path));
            console.log(`MATCHING_ROUTE_COUNT=${matches.length}`);
            for(const [path,def] of matches.slice(0,100)){
              const endpoints=Array.isArray(def.endpoints)?def.endpoints:[];
              const summary=endpoints.map(ep=>{
                const methods=Array.isArray(ep.methods)?ep.methods.join(','):String(ep.methods||'');
                const args=ep.args&&typeof ep.args==='object'?Object.keys(ep.args).sort().slice(0,40).join(','):'';
                return `{methods=${methods};args=${args}}`;
              }).join('|');
              console.log(`ROUTE path=${path} ${summary}`);
            }
            const candidates=matches.map(([p])=>p).filter(p=>/analytic|step/i.test(p)).slice(0,20);
            for(const path of candidates){
              if(/[\(\?<]/.test(path)) continue;
              const u=site+'/wp-json'+path;
              const r=await fetch(u,{headers,redirect:'manual'});
              console.log(`AUTH_CHECK path=${path} status=${r.status} error=${JSON.stringify(await safeError(r))}`);
            }
          })().catch(e=>{console.error('DISCOVERY_FATAL='+String(e.name||'Error'));process.exit(1)});
          NODE
          rm -f /tmp/fk.json
