name: Meta Write Capability Check

on:
  push:
    branches: [main, meta-write-capability-check]
    paths:
      - ".github/workflows/meta-write-capability-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 1Password/install-cli-action@v1
      - name: Confirm existing Meta token can write without changing campaign state
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OP_SERVICE_ACCOUNT_TOKEN"
          cp config/env/meta.op.env .env.meta
          op run --env-file .env.meta -- bash <<'BASH'
          set -euo pipefail
          token="$META_ACCESS_TOKEN"
          campaign_id="52628985924674"
          expected_name='Impossible In Pencil | Prospecting'

          echo "=== TOKEN PERMISSIONS ==="
          perms=$(curl -fsS --get \
            --data-urlencode "access_token=$token" \
            "https://graph.facebook.com/me/permissions")
          echo "$perms" | jq '{granted: [.data[]? | select(.status=="granted") | .permission]}'
          has_scope=$(echo "$perms" | jq -r '[.data[]? | select(.permission=="ads_management" and .status=="granted")] | length > 0')
          test "$has_scope" = "true"

          echo "=== CURRENT CAMPAIGN ==="
          before=$(curl -fsS --get \
            --data-urlencode "fields=id,name,status,effective_status" \
            --data-urlencode "access_token=$token" \
            "https://graph.facebook.com/${campaign_id}")
          echo "$before" | jq '{id,name,status,effective_status}'
          current_name=$(echo "$before" | jq -r '.name')
          test "$current_name" = "$expected_name"

          echo "=== NO-OP WRITE TEST ==="
          write=$(curl -fsS -X POST \
            --data-urlencode "name=$current_name" \
            --data-urlencode "access_token=$token" \
            "https://graph.facebook.com/${campaign_id}")
          echo "$write" | jq .
          success=$(echo "$write" | jq -r '.success // false')
          test "$success" = "true"

          echo "=== VERIFY UNCHANGED ==="
          after=$(curl -fsS --get \
            --data-urlencode "fields=id,name,status,effective_status" \
            --data-urlencode "access_token=$token" \
            "https://graph.facebook.com/${campaign_id}")
          echo "$after" | jq '{id,name,status,effective_status}'
          test "$(echo "$after" | jq -r '.name')" = "$expected_name"
          test "$(echo "$after" | jq -r '.status')" = "$(echo "$before" | jq -r '.status')"

          echo "META_WRITE_READY=true"
          BASH
