name: Meta Write Capability Check

on:
  push:
    branches: [main, meta-write-capability-check]
    paths:
      - ".github/workflows/meta-write-capability-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 1Password/install-cli-action@v1
      - name: Check existing Meta token scopes and ad account access
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OP_SERVICE_ACCOUNT_TOKEN"
          cp config/env/meta.op.env .env.meta
          op run --env-file .env.meta -- bash <<'BASH'
          set -euo pipefail
          token="$META_ACCESS_TOKEN"
          acct="$META_AD_ACCOUNT_ID"
          acct="${acct#act_}"

          echo "=== TOKEN PERMISSIONS ==="
          perms=$(curl -fsS --get \
            --data-urlencode "access_token=$token" \
            "https://graph.facebook.com/me/permissions")
          echo "$perms" | jq '{granted: [.data[]? | select(.status=="granted") | .permission], declined: [.data[]? | select(.status!="granted") | {permission,status}]}'

          echo "=== ACCESSIBLE AD ACCOUNTS ==="
          accounts=$(curl -fsS --get \
            --data-urlencode "fields=id,name,account_id,account_status" \
            --data-urlencode "limit=100" \
            --data-urlencode "access_token=$token" \
            "https://graph.facebook.com/me/adaccounts")
          echo "$accounts" | jq '{accounts: [.data[]? | {id,name,account_id,account_status}]}'

          account=$(echo "$accounts" | jq --arg acct "$acct" -c '.data[]? | select((.account_id|tostring)==$acct or .id==("act_"+$acct))' | head -n1)
          echo "=== MATCHED AD ACCOUNT ==="
          echo "${account:-null}" | jq '{id,name,account_id,account_status}'

          echo "=== CAMPAIGN ACCESS ==="
          campaigns=$(curl -fsS --get \
            --data-urlencode "fields=id,name,status,effective_status" \
            --data-urlencode "limit=1" \
            --data-urlencode "access_token=$token" \
            "https://graph.facebook.com/act_${acct}/campaigns")
          echo "$campaigns" | jq '{campaign_count: (.data | length), sample: (.data[0] // null)}'

          has_scope=$(echo "$perms" | jq -r '[.data[]? | select(.permission=="ads_management" and .status=="granted")] | length > 0')
          account_ok=$(echo "${account:-null}" | jq -r '(.account_id // "") != "" and ((.account_status // 0) == 1)')
          echo "ADS_MANAGEMENT_SCOPE=$has_scope"
          echo "ACCOUNT_ACTIVE_AND_ACCESSIBLE=$account_ok"
          if [ "$has_scope" = "true" ] && [ "$account_ok" = "true" ]; then
            echo "META_WRITE_PREREQS_READY=true"
          else
            echo "META_WRITE_PREREQS_READY=false"
            exit 1
          fi
          BASH
