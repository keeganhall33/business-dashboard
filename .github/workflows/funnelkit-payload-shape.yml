name: FunnelKit Payload Shape

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/funnelkit-shape-trigger"

permissions:
  contents: read

jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: 1Password/install-cli-action@v1
      - name: Inspect sanitized FunnelKit analytics response shape
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          op item get "FunnelKit API Credentials" --vault OpenClaw --format=json > /tmp/fk.json
          node <<'NODE'
          const fs=require('fs');
          const item=JSON.parse(fs.readFileSync('/tmp/fk.json','utf8'));
          const f=(item.fields||[]).map(x=>({l:String(x.label||'').trim().toLowerCase(),i:String(x.id||'').trim().toLowerCase(),v:typeof x.value==='string'?x.value.trim():''})).filter(x=>x.v);
          const find=(a,b=[])=>f.find(x=>a.includes(x.l)||b.includes(x.i));
          const u=find(['url','website','base url','site url'],['url']); const user=find(['username','user','login'],['username']); const p=find(['password','application password','app password','api password'],['password','credential']);
          if(!u||!user||!p) throw new Error('credential_shape');
          let base=u.v;if(!/^https?:\/\//i.test(base))base='https://'+base;base=base.replace(/\/$/,'');const wi=base.indexOf('/wp-json/');const site=wi>=0?base.slice(0,wi):base;
          const headers={Authorization:'Basic '+Buffer.from(user.v+':'+p.v).toString('base64'),Accept:'application/json','User-Agent':'business-dashboard-funnelkit-shape/1.0'};
          const url=new URL(site+'/wp-json/funnelkit-app/funnel-analytics/1/steps');url.searchParams.set('after','2026-08-27T00:00:00Z');url.searchParams.set('before','2026-08-28T00:00:00Z');
          const res=await fetch(url,{headers}); console.log(`STATUS=${res.status}`); if(!res.ok) process.exit(2);
          const payload=await res.json();
          const summarize=(value,depth=0)=>{
            if(depth>4)return typeof value;
            if(Array.isArray(value)) return {type:'array',length:value.length,sample:value.length?summarize(value[0],depth+1):null};
            if(value&&typeof value==='object'){
              const out={type:'object',keys:Object.keys(value).sort()};
              for(const k of Object.keys(value).slice(0,20)) out[k]=summarize(value[k],depth+1);
              return out;
            }
            return {type:typeof value,value:(typeof value==='string'&&value.length<100)?value:(typeof value==='number'||typeof value==='boolean'?value:null)};
          };
          console.log('PAYLOAD_SHAPE='+JSON.stringify(summarize(payload)));
          NODE
          rm -f /tmp/fk.json
