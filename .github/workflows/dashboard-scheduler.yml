name: Telemetry & Evidence Refresh

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Evidence job to run"
        required: true
        type: choice
        default: website
        options:
          - website
          - woo
          - meta
          - industry
          - cloudflare
          - leads
          - social
          - scheduler
  schedule:
    - cron: "0 10 * * *"      # Website evidence, 02:00 PT
    - cron: "5 10 * * *"      # Woo telemetry, 02:05 PT
    - cron: "0 11 * * *"      # Meta evidence, 03:00 PT
    - cron: "0 12 * * *"      # Industry evidence, 04:00 PT
    - cron: "30 12 * * *"     # Cloudflare telemetry, 04:30 PT
    - cron: "0 13 * * MON"    # Lead intelligence, Monday 06:00 PT
    - cron: "0 4 * * MON"     # Social intelligence, Sunday 20:00 PT

permissions:
  contents: read

jobs:
  woo:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'woo' || github.event_name == 'schedule' && github.event.schedule == '5 10 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: 1Password/install-cli-action@v1
      - name: Run Woo telemetry ingestion
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          test -n "$OP_SERVICE_ACCOUNT_TOKEN" || { echo "OP service account token missing" >&2; exit 1; }
          cp config/env/woo.op.env .env.woo
          op run --env-file .env.woo -- bash -lc '
            set -euo pipefail
            PROJECT_REF="$(op read "op://OpenClaw/Supabase Production API/project_ref")"
            SUPABASE_URL="$(op read "op://OpenClaw/Supabase Production API/supabase_url")"
            HOST="${SUPABASE_URL#https://}"
            HOST="${HOST#http://}"
            HOST="${HOST%%/*}"
            test "$PROJECT_REF" = "ibjsjosplgbqevmnvvpf" || { echo "Unexpected Supabase project_ref" >&2; exit 1; }
            test "$HOST" = "ibjsjosplgbqevmnvvpf.supabase.co" || { echo "Unexpected Supabase host" >&2; exit 1; }
            npm run woo:ingest
          '

  website:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'website' || github.event_name == 'schedule' && github.event.schedule == '0 10 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: 1Password/install-cli-action@v1
      - name: Run website evidence refresh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          test -n "$OP_SERVICE_ACCOUNT_TOKEN" || { echo "OP service account token missing" >&2; exit 1; }
          cp config/env/website.op.env .env.website
          op run --env-file .env.website -- npm run website:run
      - name: Upload website evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-latest-json
          path: |
            dashboard/data/website/latest.json
            dashboard/logs/website_agent.log
          retention-days: 7

  meta:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'meta' || github.event_name == 'schedule' && github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: 1Password/install-cli-action@v1
      - name: Run Meta evidence refresh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          test -n "$OP_SERVICE_ACCOUNT_TOKEN" || { echo "OP service account token missing" >&2; exit 1; }
          cp config/env/meta.op.env .env.meta
          op run --env-file .env.meta -- npm run meta:run
      - name: Upload Meta evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-latest-json
          path: |
            dashboard/data/meta/latest.json
            dashboard/logs/meta_ads_agent.log
          retention-days: 7

  industry:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'industry' || github.event_name == 'schedule' && github.event.schedule == '0 12 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run industry evidence refresh
        run: npm run industry:run

  cloudflare:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'cloudflare' || github.event_name == 'schedule' && github.event.schedule == '30 12 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: 1Password/install-cli-action@v1
      - name: Run Cloudflare telemetry refresh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          test -n "$OP_SERVICE_ACCOUNT_TOKEN" || { echo "OP service account token missing" >&2; exit 1; }
          cp config/env/cloudflare.op.env .env.cloudflare
          op run --env-file .env.cloudflare -- npm run cloudflare:run
      - name: Upload Cloudflare evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-latest-json
          path: |
            dashboard/data/cloudflare/latest.json
            dashboard/logs/cloudflare_telemetry.log
          retention-days: 7

  leads:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'leads' || github.event_name == 'schedule' && github.event.schedule == '0 13 * * MON'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: 1Password/install-cli-action@v1
      - name: Run lead evidence refresh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          test -n "$OP_SERVICE_ACCOUNT_TOKEN" || { echo "OP service account token missing" >&2; exit 1; }
          cp config/env/leads.op.env .env.leads
          op run --env-file .env.leads -- npm run leads:run

  social:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'social' || github.event_name == 'schedule' && github.event.schedule == '0 4 * * MON'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run social evidence refresh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run social:run
      - name: Upload social evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-latest-json
          path: |
            dashboard/data/social/latest.json
            dashboard/logs/social_intelligence.log
          retention-days: 7

  scheduler:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'scheduler'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record scheduler telemetry snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scheduler:status

# This workflow collects evidence only. It must not create executive recommendations.
# Career OS + Fusion + Avery own operating decisions.
