name: Application Scheduler Tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-scheduler-tick
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ vars.SCHEDULER_BASE_URL }}
      SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
    steps:
      - name: Validate scheduler target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo "SCHEDULER_BASE_URL repository variable is required" >&2; exit 1; }
          test -n "$SCHEDULER_SECRET" || { echo "SCHEDULER_SECRET repository secret is required" >&2; exit 1; }
          case "$BASE_URL" in
            *fly.dev*|*fly.io*)
              echo "Fly scheduler targets are retired. Point SCHEDULER_BASE_URL at the Vercel production dashboard." >&2
              exit 1
              ;;
          esac

      - name: Run central scheduler tick
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "x-scheduler-secret: $SCHEDULER_SECRET" \
            "$BASE_URL/api/scheduler/tick" >/dev/null

# This is the only GitHub cron for application-level scheduled_jobs.
# `/api/scheduler/tick` reads the database schedule and runs due jobs.
# Evidence ingestion has its own workflow because those jobs execute inside GitHub Actions.
