name: Autopilot Scheduler

on:
  schedule:
    - cron: '0 12 * * *'  # deliverable-harvest (05:00 PT)
    - cron: '0 13 * * *'  # ceo-digest (06:00 PT)
    - cron: '10 13 * * *' # weekly-summary (06:10 PT)
  workflow_dispatch:
    inputs:
      job:
        description: "Which low-risk job to run"
        required: true
        type: choice
        options:
          - deliverable-harvest
          - ceo-digest
          - weekly-summary

permissions:
  contents: read

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.SCHEDULER_BASE_URL || vars.PRODUCTION_BASE_URL }}
      SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
    steps:
      - name: Determine target job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.job }}"
          else
            case "${{ github.event.schedule }}" in
              '0 12 * * *') TARGET="deliverable-harvest" ;;
              '0 13 * * *') TARGET="ceo-digest" ;;
              '10 13 * * *') TARGET="weekly-summary" ;;
              *)
                echo "Unknown schedule ${{ github.event.schedule }}" >&2
                exit 1
                ;;
            esac
          fi
          echo "target_job=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Validate scheduler target
        shell: bash
        run: |
          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "SCHEDULER_SECRET must be configured" >&2
            exit 1
          fi
          if [ -z "$BASE_URL" ]; then
            echo "PRODUCTION_BASE_URL or SCHEDULER_BASE_URL must be configured" >&2
            exit 1
          fi
          case "$BASE_URL" in
            *fly.dev*)
              echo "Scheduler target still points at Fly.io: $BASE_URL" >&2
              exit 1
              ;;
          esac
          echo "Scheduler target: $BASE_URL"
          echo "Running job: ${{ steps.pick.outputs.target_job }}"

      - name: Call scheduler endpoint
        run: |
          case "${{ steps.pick.outputs.target_job }}" in
            deliverable-harvest)
              ENDPOINT="/api/scheduler/deliverable-harvest"
              ;;
            ceo-digest)
              ENDPOINT="/api/scheduler/ceo-digest"
              ;;
            weekly-summary)
              ENDPOINT="/api/scheduler/weekly-summary"
              ;;
            *)
              echo "Unknown job ${{ steps.pick.outputs.target_job }}" >&2
              exit 1
              ;;
          esac

          curl -sS --fail -X POST \
            -H "x-scheduler-secret: $SCHEDULER_SECRET" \
            "$BASE_URL$ENDPOINT"
